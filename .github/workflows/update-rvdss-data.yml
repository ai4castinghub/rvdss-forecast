name: Update RVDSS Data

on:
  workflow_dispatch:
  schedule:
    # Friday 09:00 EST / 10:00 EDT, then 11:00 EST / 12:00 EDT.
    - cron: '0 14 * * FRI'
    - cron: '0 16 * * FRI'
    # Retry later if the dashboard publication is delayed.
    - cron: '0 20 * * FRI'

permissions:
  contents: write

concurrency:
  group: update-rvdss-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      
      - name: Install Dependencies
        run: python -m pip install -r scripts/requirements.txt
      
      - name: Download latest data
        run: python scripts/rvdss_update.py

      - name: Add new files
        run: git add target-data/ auxiliary-data/season_2026_2027_raw_files/
      
      - name: Commit results
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m 'Update RVDSS data'
            git push origin HEAD:main
          fi
