name: Warm weekly workflow dependency caches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-forecast-r/action.yml'
      - '.github/workflows/cache-deps.yaml'
      - '.github/workflows/hub-model-outputs.yml'
      - '.github/workflows/update-rvdss-data.yml'
      - 'scripts/requirements.txt'
  schedule:
    - cron: '10 0 * * *'

permissions:
  contents: read

jobs:
  python-cache:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python and restore pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Download Python dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          python -c "import bs4, epiweeks, pandas, regex, requests; print('Python dependencies ready')"

  r-cache:
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-forecast-r
