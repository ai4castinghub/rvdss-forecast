name: Hub Model Forecast Workflow

on:
  schedule:
    - cron: '30 10 * * MON'
      timezone: 'America/Toronto'
  workflow_dispatch:
    inputs:
      reference_date:
        description: 'Saturday reference date (YYYY-MM-DD); blank uses the previous Saturday'
        required: false
        type: string
      overwrite:
        description: 'Regenerate existing forecast files'
        required: false
        type: boolean
        default: false

concurrency:
  group: hub-model-forecasts
  cancel-in-progress: false

jobs:
  run-r-script:
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and install forecast R dependencies
        uses: ./.github/actions/setup-forecast-r

      - name: Generate previous Saturday's hub forecasts
        env:
          FORECAST_REFERENCE_DATE: ${{ inputs.reference_date }}
          FORECAST_OVERWRITE: ${{ inputs.overwrite }}
        run: Rscript scripts/hub_model_forecasts.R

      - name: Add new files
        run: git add model-output/

      - name: Commit results
        run: |
          git config --local user.name "${{ github.actor }}"
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git diff --cached --quiet || git commit -m 'Update hub forecasts'

      - name: Push changes with personal token
        env:
          GITHUB_PAT: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git push https://${{ secrets.PERSONAL_GITHUB_TOKEN }}@github.com/ai4castinghub/rvdss-forecast.git HEAD:main
