name: Weekly RVDSS Hub Pipeline

on:
  schedule:
    - cron: '0 10 * * MON'
      timezone: 'America/Toronto'
  workflow_dispatch:
    inputs:
      reference_date:
        description: 'Saturday reference date (YYYY-MM-DD); blank uses the previous Saturday'
        required: false
        type: string
      overwrite:
        description: 'Regenerate existing forecast files'
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-rvdss-hub-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-r-script:
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and install forecast R dependencies
        uses: ./.github/actions/setup-forecast-r

      - name: Concatenate truth and submitted models
        run: Rscript scripts/build_concatenated_rvdss_target_and_forecast.R

      - name: Generate previous Saturday's hub forecasts
        env:
          FORECAST_REFERENCE_DATE: ${{ inputs.reference_date }}
          FORECAST_OVERWRITE: ${{ inputs.overwrite }}
        run: Rscript scripts/hub_model_forecasts.R

      - name: Rebuild model data with hub forecasts
        run: Rscript scripts/build_concatenated_rvdss_target_and_forecast.R --models-only

      - name: Generate previous Saturday's ensemble
        env:
          FORECAST_REFERENCE_DATE: ${{ inputs.reference_date }}
          FORECAST_OVERWRITE: ${{ inputs.overwrite }}
        run: Rscript scripts/all_hub_ensemble.R

      - name: Include ensemble in saved model data
        run: Rscript scripts/build_concatenated_rvdss_target_and_forecast.R --models-only

      - name: Add new files
        run: git add auxiliary-data/concatenated_rvdss_data.csv auxiliary-data/concatenated_model_output.csv model-output/

      - name: Commit results
        run: |
          git config --local user.name "${{ github.actor }}"
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No weekly output changes to commit"
          else
            git commit -m 'Update weekly hub outputs'
            git push https://${{ secrets.PERSONAL_GITHUB_TOKEN }}@github.com/ai4castinghub/rvdss-forecast.git HEAD:main
          fi
