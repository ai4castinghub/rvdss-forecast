name: Hub Submission Validation (R)

on:
  workflow_dispatch:
  pull_request:
    branches: main
    paths:
      - 'model-output/**'
      - 'model-metadata/*'
      - '!**README**'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate_and_check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for the 2026-27 deadline check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run hubverse submission validations
        if: github.event_name == 'pull_request'
        uses: hubverse-org/hubverse-actions/validate-submission@v2
        with:
          summary: true
          # The separate deadline check uses the PR event time.
          skip_submit_window_check: true

      # ---------- Git diff + path checks  ----------

      - name: Fetch base branch
        if: always() && github.event_name == 'pull_request'
        run: |
          # github.base_ref is the base branch of the PR (e.g. "main")
          git fetch origin ${{ github.base_ref }}

      - name: Run git diff to find changed files
        if: always() && github.event_name == 'pull_request'
        run: |
          # Compare PR HEAD to the base branch using merge-base (three dots)
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Check if changes are outside allowed directories
        if: always() && github.event_name == 'pull_request'
        run: |
          # Filter out files not in the allowed directories
          UNALLOWED_CHANGES=$(grep -vE '^model-metadata/|^model-output/' changed_files.txt || true)

          if [[ -n "$UNALLOWED_CHANGES" ]]; then
            echo "Error: Changes outside allowed directories detected:"
            echo "$UNALLOWED_CHANGES"
            exit 1
          else
            echo "All changes are within allowed directories."
          fi

      - name: Check 2026-27 submission deadline
        if: always() && github.event_name == 'pull_request'
        run: python scripts/check_submission_deadline.py
